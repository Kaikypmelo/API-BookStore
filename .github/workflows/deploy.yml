name: Build and Deploy to Azure

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Versão atualizada

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2 # Versão atualizada
        with:
          login-server: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push container image to ACR
        run: |
          docker build -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/bookstore-api:${{ github.sha }} .
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/bookstore-api:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3 # Versão atualizada
        with:
          app-name: 'webapp-aula123-kaiky' # Lembre-se de manter o nome exato do seu Web App aqui
          publish-profile: ${{ secrets.WEBAPP_PUBLISH_PROFILE }}
          images: '${{ secrets.REGISTRY_LOGIN_SERVER }}/bookstore-api:${{ github.sha }}'